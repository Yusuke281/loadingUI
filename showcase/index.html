<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローディングUIデモ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="demo-container">
        <header>
            <h1>ローディングUIデモ</h1>
            <p>この研究プロジェクトで分析されたローディングUIの一覧です。</p>
        </header>

        <nav class="controls">
            <button class="control-btn" data-loader="spinner">Spinner</button>
            <button class="control-btn" data-loader="spinner-color">Spinner (Color)</button>
            <button class="control-btn" data-loader="bar">Progress Bar</button>
            <button class="control-btn" data-loader="bar-color">Progress Bar (Color)</button>
            <button class="control-btn" data-loader="bouncing-dots">Bouncing Dots</button>
            <button class="control-btn" data-loader="skeleton">Skeleton</button>
            <button class="control-btn" data-loader="skeleton-color">Skeleton (Color)</button>
            <button class="control-btn" data-loader="none">None</button>
        </nav>

        <main class="display-area">
            <div id="loader-placeholder" class="loader-wrapper active">
                <p>上のボタンをクリックして、デモを開始してください。</p>
            </div>

            <!-- ローダーをここに定義（デフォルトは非表示） -->
            <div id="spinner" class="loader-wrapper">
                <div class="spinner"></div>
            </div>
            <div id="spinner-color" class="loader-wrapper">
                <div class="spinner color"></div>
            </div>
            <div id="bar" class="loader-wrapper">
                <div class="progress-bar-container">
                    <div class="progress-bar"></div>
                </div>
            </div>
            <div id="bar-color" class="loader-wrapper">
                <div class="progress-bar-container">
                    <div class="progress-bar color"></div>
                </div>
            </div>
            <div id="bouncing-dots" class="loader-wrapper">
                <div class="bouncing-dots"><div></div><div></div><div></div></div>
            </div>
            <div id="skeleton" class="loader-wrapper skeleton-grid">
                <!-- 3x Skeleton Cards -->
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton-text"></div>
                        <div class="skeleton-text short"></div>
                    </div>
                    <div class="skeleton-button"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton-text"></div>
                        <div class="skeleton-text short"></div>
                    </div>
                    <div class="skeleton-button"></div>
                </div>
                <div class="skeleton-card">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton-text"></div>
                        <div class="skeleton-text short"></div>
                    </div>
                    <div class="skeleton-button"></div>
                </div>
            </div>
            <div id="skeleton-color" class="loader-wrapper skeleton-grid">
                <!-- 3x Skeleton Cards (Color) -->
                <div class="skeleton-card color">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton-text"></div>
                        <div class="skeleton-text short"></div>
                    </div>
                    <div class="skeleton-button"></div>
                </div>
                <div class="skeleton-card color">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton-text"></div>
                        <div class="skeleton-text short"></div>
                    </div>
                    <div class="skeleton-button"></div>
                </div>
                <div class="skeleton-card color">
                    <div class="skeleton-image"></div>
                    <div class="skeleton-content">
                        <div class="skeleton-text"></div>
                        <div class="skeleton-text short"></div>
                    </div>
                    <div class="skeleton-button"></div>
                </div>
            </div>
            <div id="none" class="loader-wrapper">
                <p>（ローダーなし）</p>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
